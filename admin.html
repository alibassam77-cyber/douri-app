<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم العيادة - دوري</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
    <header class="app-header">
        <div class="header-inner">
            <div class="brand-box">
                <i class="fa-solid fa-stethoscope brand-icon"></i>
                <div>
                    <h1 class="app-title" id="activeDoctorName">لوحة الطبيب</h1>
                    <p class="app-subtitle" data-i18n="admin_subtitle">إدارة طابور الانتظار والعيادات</p>
                </div>
            </div>
            <div class="header-actions">
                <button type="button" class="btn-outline" onclick="openAddClinicModal()">
                    <i class="fa-solid fa-plus"></i> إضافة عيادة
                </button>
                <button type="button" class="btn-outline" onclick="openEditClinicModal()">
                    <i class="fa-solid fa-pen-to-square"></i> تعديل / حذف العيادة
                </button>
                <button type="button" id="toggleClinicBtn" class="status-toggle-btn status-open" onclick="toggleClinicStatus()">
                    <i class="fa-solid fa-lock"></i> إغلاق العيادة
                </button>
                <button type="button" class="btn-danger" onclick="logoutDoctor()">
                    <i class="fa-solid fa-right-from-bracket"></i> خروج
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="admin-controls-bar">
            <div>
                <label for="clinicSelector">اختر العيادة:</label>
                <select id="clinicSelector" onchange="changeClinic()"></select>
            </div>
            <div>
                <label for="adminDate">التاريخ:</label>
                <input type="date" id="adminDate" onchange="changeAdminDate()">
            </div>
        </div>

        <div class="serving-banner">
            <div>
                <span data-i18n="currently_serving_label">الدور الحالي</span>
                <strong id="currentServingDisplay">-</strong>
            </div>
            <div>
                <span data-i18n="patient_name_label">اسم المريض</span>
                <strong id="currentServingName">-</strong>
                <small id="currentServingSerial" style="display:block; margin-top:4px;"></small>
            </div>
            <button type="button" class="btn-primary next-btn" onclick="callNextPatient()">
                <i class="fa-solid fa-bullhorn"></i> نداء المريض التالي
            </button>
        </div>

        <h3 style="margin:18px 0 10px 0;">قائمة الانتظار</h3>
        <div id="patientsQueue" class="queue-list"></div>
    </main>

    <!-- نافذة إضافة عيادة جديدة -->
    <div id="addClinicModal" class="modal-backdrop hidden">
        <div class="modal-card modal-wide">
            <div class="modal-header">
                <h3>إضافة عيادة جديدة</h3>
                <button type="button" class="close-btn" onclick="closeAddClinicModal()">&times;</button>
            </div>
            <div class="modal-body">
                <label>اسم العيادة</label>
                <input type="text" id="addClinicName" placeholder="اسم العيادة">

                <label>المدينة</label>
                <input type="text" id="addCity" placeholder="المدينة">

                <label>الشارع / الحي</label>
                <input type="text" id="addStreet" placeholder="الشارع أو الحي">

                <label>علامة مميزة</label>
                <input type="text" id="addLandmark" placeholder="بجوار...">

                <label>وقت البدء</label>
                <input type="time" id="addStartTime" value="09:00">

                <label>وقت الانتهاء</label>
                <input type="time" id="addEndTime" value="17:00">

                <label>مدة الكشف لكل مريض (بالدقائق)</label>
                <input type="number" id="addServiceTime" value="10" min="1">

                <label>أيام العمل</label>
                <div class="days-grid">
                    <label><input type="checkbox" id="add_day_0"> الأحد</label>
                    <label><input type="checkbox" id="add_day_1"> الإثنين</label>
                    <label><input type="checkbox" id="add_day_2"> الثلاثاء</label>
                    <label><input type="checkbox" id="add_day_3"> الأربعاء</label>
                    <label><input type="checkbox" id="add_day_4"> الخميس</label>
                    <label><input type="checkbox" id="add_day_5"> الجمعة</label>
                    <label><input type="checkbox" id="add_day_6"> السبت</label>
                </div>

                <label>حدد موقع العيادة على الخريطة</label>
                <div id="add-map" style="height:220px; border-radius:8px; margin-bottom:8px;"></div>
                <input type="hidden" id="addLat">
                <input type="hidden" id="addLng">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-primary" onclick="saveNewClinic()">حفظ العيادة</button>
                <button type="button" class="btn-outline" onclick="closeAddClinicModal()">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- نافذة تعديل أو حذف العيادة -->
    <div id="editClinicModal" class="modal-backdrop hidden">
        <div class="modal-card modal-wide">
            <div class="modal-header">
                <h3>تعديل أو حذف العيادة</h3>
                <button type="button" class="close-btn" onclick="closeEditClinicModal()">&times;</button>
            </div>
            <div class="modal-body">
                <label>اسم العيادة</label>
                <input type="text" id="editClinicName">

                <label>المدينة</label>
                <input type="text" id="editCity">

                <label>الشارع / الحي</label>
                <input type="text" id="editStreet">

                <label>علامة مميزة</label>
                <input type="text" id="editLandmark">

                <label>وقت البدء</label>
                <input type="time" id="editStartTime">

                <label>وقت الانتهاء</label>
                <input type="time" id="editEndTime">

                <label>مدة الكشف لكل مريض (بالدقائق)</label>
                <input type="number" id="editServiceTime" min="1">

                <label>أيام العمل</label>
                <div class="days-grid">
                    <label><input type="checkbox" id="edit_day_0"> الأحد</label>
                    <label><input type="checkbox" id="edit_day_1"> الإثنين</label>
                    <label><input type="checkbox" id="edit_day_2"> الثلاثاء</label>
                    <label><input type="checkbox" id="edit_day_3"> الأربعاء</label>
                    <label><input type="checkbox" id="edit_day_4"> الخميس</label>
                    <label><input type="checkbox" id="edit_day_5"> الجمعة</label>
                    <label><input type="checkbox" id="edit_day_6"> السبت</label>
                </div>

                <label>حدد موقع العيادة على الخريطة</label>
                <div id="edit-map" style="height:220px; border-radius:8px; margin-bottom:8px;"></div>
                <input type="hidden" id="editLat">
                <input type="hidden" id="editLng">

                <button type="button" class="btn-primary" style="width:100%; margin-top:12px;" onclick="saveEditClinic()">حفظ التعديلات</button>

                <div class="danger-zone-box">
                    <h4 style="margin:0 0 8px 0; color:#dc2626;">إلغاء وحذف العيادة بالكامل</h4>
                    <p style="margin:0 0 8px 0; font-size:12px;">سيتم حذف العيادة وجميع حجوزاتها نهائياً. لكي يتم الحذف، اكتب العبارة التالية بدقة: <b>إحذف العيادة</b></p>
                    <input type="text" id="deleteClinicConfirmInput" placeholder="اكتب: إحذف العيادة" style="width:100%; padding:8px; margin-bottom:8px;">
                    <button type="button" onclick="deleteCurrentClinic()" style="width:100%; padding:9px; background:#dc2626; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">تأكيد حذف العيادة</button>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-outline" onclick="closeEditClinicModal()">إغلاق</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="lang.js"></script>
    <script src="admin.js"></script>
</body>
</html>
