<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيادة - نظام حجز وطوابير العيادات</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
    <header class="app-header">
        <div class="header-inner">
            <div class="brand-box">
                <i class="fa-solid fa-hospital-user brand-icon"></i>
                <div>
                    <h1 class="app-title" data-i18n="app_title">عيادة</h1>
                    <p class="app-subtitle" data-i18n="app_subtitle">نظام حجز وطوابير العيادات</p>
                </div>
            </div>
            <div class="header-actions">
                <button type="button" class="btn-outline" onclick="showMyBookingsView()">
                    <i class="fa-solid fa-ticket"></i> <span data-i18n="my_bookings_btn">حجوزاتي</span>
                </button>
                <button type="button" class="btn-outline" onclick="restoreBookingByCode()">
                    <i class="fa-solid fa-key"></i> <span data-i18n="restore_btn">استعادة بالرمز السري</span>
                </button>
                <button type="button" class="btn-primary" onclick="openDoctorModal()">
                    <i class="fa-solid fa-user-doctor"></i> <span data-i18n="doctors_portal_btn">الأطباء</span>
                </button>
                <button type="button" id="langToggle" class="btn-outline" onclick="toggleLanguage()">EN</button>
                <button type="button" id="themeToggle" class="btn-icon" onclick="toggleTheme()" aria-label="تبديل المظهر">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="activeBookingBanner" class="active-banner hidden" onclick="showMyBookingsView()">
            <i class="fa-solid fa-bell"></i>
            <span id="bannerText"></span>
        </div>

        <section id="main-view">
            <div class="search-bar-box">
                <input type="text" id="searchInput" oninput="filterDoctors()" placeholder="ابحث باسم الطبيب أو التخصص..." data-i18n-placeholder="search_placeholder">
                <input type="text" id="cityFilter" list="citiesList" oninput="filterDoctors()" placeholder="اختر أو اكتب المدينة..." data-i18n-placeholder="city_placeholder">
                <datalist id="citiesList"></datalist>
            </div>

            <div id="doctorsList" class="clinics-grid">
                <div class="clinic-card skeleton-card"></div>
                <div class="clinic-card skeleton-card"></div>
                <div class="clinic-card skeleton-card"></div>
            </div>
        </section>

        <section id="bookings-view" class="hidden">
            <div class="view-header">
                <h2 data-i18n="my_bookings_title">حجوزاتي النشطة</h2>
                <button type="button" class="btn-outline" onclick="goBackToSearch()">
                    <i class="fa-solid fa-arrow-right"></i> <span data-i18n="back_to_search">العودة للبحث</span>
                </button>
            </div>
            <div id="myBookingsList" class="clinics-grid"></div>
        </section>

        <section id="ticket-view" class="hidden">
            <div class="view-header">
                <h2 data-i18n="ticket_title">تذكرة الحجز</h2>
                <button type="button" class="btn-outline" onclick="showMyBookingsView()">
                    <i class="fa-solid fa-arrow-right"></i> <span data-i18n="back_btn">رجوع</span>
                </button>
            </div>

            <div id="ticketAlertBox" class="ticket-alert-box hidden"></div>

            <div class="ticket-card">
                <div class="ticket-top">
                    <h3 id="patientNameDisplay">---</h3>
                    <span id="ticketStatus" class="badge">---</span>
                </div>

                <div class="ticket-number-box">
                    <span data-i18n="your_ticket_label">رقم دورك</span>
                    <strong id="ticketNumber">-</strong>
                </div>

                <p id="doctorNameDisplay" class="ticket-meta">---</p>
                <p id="appointmentDateDisplay" class="ticket-meta">---</p>

                <div class="ticket-stats">
                    <div>
                        <span data-i18n="people_ahead_label">أمامك</span>
                        <strong id="peopleAhead">-</strong>
                    </div>
                    <div>
                        <span data-i18n="wait_time_label">الانتظار التقريبي (دقائق)</span>
                        <strong id="waitTime">-</strong>
                    </div>
                    <div>
                        <span data-i18n="eta_label">موعدك المتوقع</span>
                        <strong id="etaTime">-</strong>
                    </div>
                </div>

                <div class="ticket-number-box" style="margin-top:12px;">
                    <span data-i18n="countdown_label">العد التنازلي للموعد</span>
                    <strong id="appointmentCountdown">--:--</strong>
                </div>

                <div id="bookingCredentials" class="credentials-box hidden">
                    <p><strong>رقم الحجز:</strong> <span id="bookingReference">---</span></p>
                    <p><strong>الرمز السري:</strong> <span id="bookingSecret">---</span></p>
                    <button type="button" class="btn-outline" onclick="copyPatientCredentials()">
                        <i class="fa-solid fa-copy"></i> <span data-i18n="copy_secret_btn">نسخ الرمز السري</span>
                    </button>
                </div>

                <button type="button" class="btn-danger" style="width:100%; margin-top:15px;" onclick="cancelCurrentTicket()">
                    <i class="fa-solid fa-xmark"></i> <span data-i18n="cancel_booking_btn">إلغاء الحجز</span>
                </button>
            </div>
        </section>
    </main>

    <!-- نافذة حجز موعد -->
    <div id="bookingModal" class="modal-backdrop hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalDoctorName">حجز موعد</h3>
                <button type="button" class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <label data-i18n="patient_name_label">اسم المريض</label>
                <input type="text" id="bookingName" placeholder="أدخل اسم المريض">

                <label data-i18n="patient_phone_label">رقم الهاتف</label>
                <input type="tel" id="bookingPhone" placeholder="أدخل رقم الهاتف">

                <label>اختر يوم الحجز</label>
                <input type="hidden" id="bookingDate">
                <div id="customBookingCalendar" class="custom-calendar"></div>
                <small id="calendarHint" style="display:block; margin-top:6px; color:var(--text-muted); font-size:12px;"></small>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-primary" onclick="confirmBooking()" data-i18n="confirm_booking_btn">تأكيد الحجز</button>
                <button type="button" class="btn-outline" onclick="closeModal()" data-i18n="close_btn">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- نافذة اختيار العيادة -->
    <div id="clinicSelectionModal" class="modal-backdrop hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3 data-i18n="choose_clinic_title">اختر العيادة</h3>
                <button type="button" class="close-btn" onclick="closeClinicSelectionModal()">&times;</button>
            </div>
            <div id="clinicSelectionList" class="modal-body"></div>
        </div>
    </div>

    <!-- نافذة دخول وتسجيل الأطباء -->
    <div id="doctorModal" class="modal-backdrop hidden">
        <div class="modal-card modal-wide">
            <div class="modal-header">
                <h3 data-i18n="doctors_portal_title">بوابة الأطباء</h3>
                <button type="button" class="close-btn" onclick="closeDoctorModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="auth-tabs">
                    <button type="button" id="tabLogin" class="auth-tab active" onclick="switchAuthTab('login')">تسجيل الدخول</button>
                    <button type="button" id="tabRegister" class="auth-tab" onclick="switchAuthTab('register')">إنشاء حساب عيادة</button>
                </div>

                <div id="loginSection">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" placeholder="doctor@example.com">

                    <label>كلمة المرور</label>
                    <input type="password" id="loginPassword" placeholder="********">

                    <button type="button" class="btn-primary" style="width:100%; margin-top:12px;" onclick="loginDoctor()">دخول</button>
                </div>

                <div id="registerSection" class="hidden">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="regEmail" placeholder="doctor@example.com">

                    <label>كلمة المرور (6 أحرف على الأقل)</label>
                    <input type="password" id="regPassword" placeholder="********">

                    <label>رمز التفعيل</label>
                    <input type="text" id="regActivationCode" placeholder="أدخل رمز التفعيل">

                    <label>اسم الطبيب</label>
                    <input type="text" id="docName" placeholder="د. أحمد محمد">

                    <label>التخصص</label>
                    <input type="text" id="docSpecialty" placeholder="باطنية / أطفال / أسنان...">

                    <label>رقم الهاتف</label>
                    <input type="tel" id="docPhone" placeholder="رقم التواصل">

                    <hr style="margin:14px 0;">

                    <label>اسم العيادة</label>
                    <input type="text" id="docClinicName" placeholder="عيادة الشفاء">

                    <label>المدينة</label>
                    <input type="text" id="docCity" placeholder="المدينة">

                    <label>الشارع / الحي</label>
                    <input type="text" id="docStreet" placeholder="الشارع أو الحي">

                    <label>علامة مميزة</label>
                    <input type="text" id="docLandmark" placeholder="بجوار...">

                    <label>وقت البدء</label>
                    <input type="time" id="docStartTime" value="09:00">

                    <label>وقت الانتهاء</label>
                    <input type="time" id="docEndTime" value="17:00">

                    <label>مدة الكشف لكل مريض (بالدقائق)</label>
                    <input type="number" id="docServiceTime" value="10" min="1">

                    <label>أيام العمل</label>
                    <div class="days-grid">
                        <label><input type="checkbox" id="day_0"> الأحد</label>
                        <label><input type="checkbox" id="day_1"> الإثنين</label>
                        <label><input type="checkbox" id="day_2"> الثلاثاء</label>
                        <label><input type="checkbox" id="day_3"> الأربعاء</label>
                        <label><input type="checkbox" id="day_4"> الخميس</label>
                        <label><input type="checkbox" id="day_5"> الجمعة</label>
                        <label><input type="checkbox" id="day_6"> السبت</label>
                    </div>

                    <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px;">
                        <label style="margin:0;">حدد موقع العيادة على الخريطة</label>
                        <button type="button" class="btn-outline" onclick="useCurrentLocationForClinic()">
                            <i class="fa-solid fa-location-crosshairs"></i> <span data-i18n="my_location_btn">تحديد موقعي الحالي</span>
                        </button>
                    </div>
                    <div id="reg-map" style="height:220px; border-radius:8px; margin-bottom:8px;"></div>
                    <input type="hidden" id="docLat">
                    <input type="hidden" id="docLng">

                    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;">
                        <button type="button" class="btn-outline" onclick="addAnotherClinicField()">+ إضافة عيادة أخرى</button>
                        <button type="button" class="btn-primary" onclick="registerAndSaveDoctor()">حفظ وإنشاء الحساب</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="lang.js"></script>
    <script src="script.js"></script>
</body>
</html>
