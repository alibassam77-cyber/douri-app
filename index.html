<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="app_title">عيادة | Clinic</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #0f766e; --primary-light: #ccfbf1; --bg-color: #f0f8f7;
            --card-bg: #ffffff; --text-main: #333333; --text-muted: #6b7280;
            --border-color: #e5e7eb; --danger: #dc2626; --danger-light: #fee2e2;
            --warning: #d97706; --warning-light: #fef3c7; --success: #059669; --success-light: #d1fae5;
        }
        [data-theme="dark"] {
            --primary: #14b8a6; --primary-light: #134e4a; --bg-color: #111827;
            --card-bg: #1f2937; --text-main: #f3f4f6; --text-muted: #9ca3af;
            --border-color: #374151; --danger: #ef4444; --danger-light: #7f1d1d;
            --warning: #fbbf24; --warning-light: #78350f; --success: #10b981; --success-light: #064e3b;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; padding-bottom: 30px; }
        .top-header { background-color: var(--primary); color: white; padding: 20px; border-radius: 0 0 20px 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header-content { display: flex; justify-content: space-between; align-items: center; max-width: 800px; margin: 0 auto; }
        .top-header h1 { margin: 0; font-size: 24px; }
        .header-buttons { display: flex; gap: 8px; align-items: center; }
        .btn-doctor-login, .lang-btn, .theme-btn { background: rgba(255,255,255,0.2); color: white; border: 1px solid white; padding: 8px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .theme-btn { padding: 8px; border-radius: 50%; width: 40px; height: 40px; justify-content: center; }
        .btn-doctor-login:hover, .lang-btn:hover, .theme-btn:hover { background: white; color: var(--primary); }
        .container { max-width: 800px; margin: 0 auto; padding: 0 15px; }
        .filter-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .input-icon-wrapper { position: relative; flex: 1; min-width: 150px; }
        .input-icon-wrapper i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .input-icon-wrapper input, .input-icon-wrapper select { width: 100%; padding: 12px 40px 12px 15px; border: 1px solid var(--border-color); border-radius: 12px; background-color: var(--card-bg); color: var(--text-main); font-size: 15px; outline: none; }
        .clinic-card { background-color: var(--card-bg); border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: right; border: 1px solid var(--border-color); animation: slideUp 0.4s ease-out; }
        .clinic-info h2 { color: var(--text-main); font-size: 18px; margin: 0 0 5px 0; }
        .doc-specialty { color: var(--primary); font-weight: bold; font-size: 14px; margin-bottom: 10px; }
        .doc-address { color: var(--text-muted); font-size: 13px; margin-bottom: 10px; }
        .map-btn { display: inline-flex; align-items: center; gap: 6px; background-color: var(--bg-color); color: var(--primary); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: bold; text-decoration: none; margin-top: 5px; }
        .clinic-status { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge.green { background-color: var(--success-light); color: var(--success); }
        button { font-family: inherit; font-weight: bold; cursor: pointer; border-radius: 10px; transition: transform 0.1s; display: flex; justify-content: center; align-items: center; gap: 8px; border: none;}
        button:active { transform: scale(0.97); }
        .btn-primary, .book-btn { width: 100%; padding: 12px; background-color: var(--primary); color: white; font-size: 16px; }
        .btn-outline { width: 100%; padding: 12px; background-color: transparent; color: var(--primary); border: 1px solid var(--primary); font-size: 14px; margin-bottom: 10px; }
        .btn-danger { width: 100%; padding: 12px; background-color: transparent; color: var(--danger); border: 1px solid var(--danger); font-size: 14px; }
        #activeBookingBanner { background-color: var(--success-light); color: var(--success); padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: center; font-weight: bold; cursor: pointer; border: 1px solid var(--success); }
        .hidden { display: none !important; }
        .ticket-card { background-color: var(--card-bg); border-radius: 20px; padding: 30px 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid var(--border-color); animation: slideUp 0.5s ease-out; }
        .muted { color: var(--text-muted); font-size: 14px; margin-bottom: 5px; }
        .big-number { font-size: 80px; font-weight: 900; color: var(--primary); margin: 0; line-height: 1; }
        .status-badge { display: inline-block; background-color: var(--warning-light); color: var(--warning); padding: 6px 18px; border-radius: 20px; font-size: 14px; font-weight: bold; margin-top: 15px; margin-bottom: 25px; }
        .stats-row { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 25px; }
        .stat-box { flex: 1; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px 5px; }
        .stat-value { font-size: 22px; font-weight: bold; color: var(--text-main); }
        .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 5px; }
        .ticket-hint { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.6; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(3px); }
        .modal-content { background-color: var(--card-bg); width: 90%; max-width: 400px; padding: 25px; border-radius: 20px; border: 1px solid var(--border-color); animation: popIn 0.3s; }
        .input-group { margin-bottom: 15px; text-align: right; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--text-main); font-size: 14px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 16px; background-color: var(--bg-color); color: var(--text-main);}
        .view-title { text-align: center; color: var(--primary); margin-top: 0; }
        .skeleton-card { height: 150px; background-color: var(--border-color); border-radius: 16px; margin-bottom: 15px; animation: shimmer 1.5s infinite linear; background-image: linear-gradient(90deg, var(--border-color) 0px, var(--card-bg) 40px, var(--border-color) 80px); background-size: 600px; }
        .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); }
        .auth-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-weight: bold; color: var(--text-muted); border-bottom: 3px solid transparent; }
        .auth-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        #reg-map { height: 200px; width: 100%; border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--border-color); z-index: 1; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes shimmer { 0% { background-position: -600px 0; } 100% { background-position: 600px 0; } }
    </style>
</head>
<body>

    <header class="top-header">
        <div class="header-content">
            <div><h1 data-i18n="app_title">عيادة | Clinic</h1></div>
            <div class="header-buttons">
                <button class="lang-btn" onclick="toggleLanguage()" id="langToggleBtn">EN</button>
                <button class="btn-doctor-login" onclick="openDoctorModal()"><i class="fa-solid fa-user-doctor"></i> <span data-i18n="doctors_btn">الأطباء</span></button>
                <button id="themeToggle" class="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
            </div>
        </div>
    </header>

    <div class="container">
        <div id="main-view">
            <div id="activeBookingBanner" class="hidden" onclick="showMyBookingsView()"><i class="fa-solid fa-ticket"></i> <span id="bannerText"></span></div>
            <div class="filter-row">
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-city"></i>
                    <select id="cityFilter" onchange="filterDoctors()"><option value="" data-i18n="all_cities">كل المدن</option></select>
                </div>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="اسم الطبيب أو التخصص..." oninput="filterDoctors()" data-i18n-placeholder="search_placeholder">
                </div>
            </div>
            <div id="doctorsList">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
        </div>

        <div id="bookings-view" class="hidden">
            <h3 class="view-title" data-i18n="my_bookings_title">حجوزاتي النشطة</h3>
            <div id="myBookingsList"></div>
            <button class="btn-primary" onclick="goBackToSearch()"><i class="fa-solid fa-arrow-right"></i> <span data-i18n="back_to_search">العودة للبحث</span></button>
        </div>

        <div id="ticket-view" class="hidden">
            <div class="ticket-card">
                <p class="muted" data-i18n="your_ticket_number">رقم دورك</p>
                <div class="big-number" id="ticketNumber">1</div>
                <div class="status-badge" data-i18n="status_waiting">في الانتظار</div>
                <div class="stats-row">
                    <div class="stat-box"><div class="stat-value" id="peopleAhead">—</div><div class="stat-label" data-i18n="ahead_label">أمامك</div></div>
                    <div class="stat-box"><div class="stat-value" id="waitTime">—</div><div class="stat-label" data-i18n="wait_time_label">دقيقة انتظار</div></div>
                    <div class="stat-box"><div class="stat-value" id="etaTime">—</div><div class="stat-label" data-i18n="eta_label">الوقت المتوقع</div></div>
                </div>
                <p class="ticket-hint"><span data-i18n="welcome_msg">أهلاً</span> <span id="patientNameDisplay" style="font-weight:bold;"></span>، <span data-i18n="ticket_hint">شاشة التذكرة تتحدث تلقائياً.</span></p>
                <p class="muted" id="doctorNameDisplay" style="font-size:14px; font-weight:bold; color:var(--primary);"></p>
                <button class="btn-outline" onclick="showMyBookingsView()"><i class="fa-solid fa-list"></i> <span data-i18n="back_to_bookings">العودة لقائمة حجوزاتي</span></button>
                <button class="btn-danger" onclick="cancelCurrentTicket()"><i class="fa-solid fa-trash"></i> <span data-i18n="cancel_booking_btn">إلغاء هذا الحجز</span></button>
            </div>
        </div>
    </div>

    <div id="bookingModal" class="hidden modal-overlay">
        <div class="modal-content">
            <h3 class="view-title" data-i18n="confirm_booking_title">تأكيد الحجز</h3>
            <p class="muted" id="modalDoctorName" style="text-align: center; margin-bottom: 20px;">عند: ...</p>
            <div class="input-group">
                <label data-i18n="full_name_label">الاسم الكامل:</label>
                <input type="text" id="bookingName" list="patientNames" oninput="autofillPhone()" placeholder="اكتب اسمك هنا" data-i18n-placeholder="name_placeholder">
                <datalist id="patientNames"></datalist>
            </div>
            <div class="input-group">
                <label data-i18n="phone_label">رقم الهاتف:</label>
                <input type="tel" inputmode="numeric" id="bookingPhone" placeholder="مثال: 777123456" data-i18n-placeholder="phone_placeholder">
            </div>
            <button class="btn-primary" onclick="confirmBooking()"><i class="fa-solid fa-check"></i> <span data-i18n="confirm_btn">تأكيد الحجز</span></button>
            <button class="btn-outline" onclick="closeModal()" style="margin-top:10px; border:none;" data-i18n="cancel_btn">إلغاء</button>
        </div>
    </div>

    <div id="doctorModal" class="hidden modal-overlay">
        <div class="modal-content" style="max-height: 90vh; overflow-y: auto;">
            <h3 class="view-title" style="margin-bottom: 10px;" data-i18n="doctor_portal_title">بوابة الأطباء</h3>
            <div class="auth-tabs">
                <div id="tabLogin" class="auth-tab active" onclick="switchAuthTab('login')" data-i18n="login_tab">دخول</div>
                <div id="tabRegister" class="auth-tab" onclick="switchAuthTab('register')" data-i18n="register_tab">حساب طبيب جديد</div>
            </div>
            <div id="loginSection">
                <div class="input-group"><label data-i18n="email_label">البريد الإلكتروني:</label><input type="email" id="loginEmail" autocomplete="username"></div>
                <div class="input-group"><label data-i18n="password_label">كلمة المرور:</label><input type="password" id="loginPassword" autocomplete="current-password"></div>
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 15px;">
                    <input type="checkbox" id="rememberMe" style="width: 18px; height: 18px;">
                    <label for="rememberMe" data-i18n="remember_me">تذكرني</label>
                </div>
                <button class="btn-primary" onclick="loginDoctor()"><i class="fa-solid fa-right-to-bracket"></i> <span data-i18n="login_btn">تسجيل الدخول</span></button>
                <button class="btn-outline" onclick="closeDoctorModal()" style="margin-top:10px; border:none;" data-i18n="cancel_btn">إلغاء</button>
            </div>
            <div id="registerSection" class="hidden">
                <div class="input-group"><label data-i18n="email_label">البريد الإلكتروني:</label><input type="email" id="regEmail"></div>
                <div class="input-group"><label data-i18n="password_min_label">كلمة المرور (6 أحرف على الأقل):</label><input type="password" id="regPassword"></div>
                <div class="input-group"><label data-i18n="activation_code_label">كود التفعيل:</label><input type="text" id="regActivationCode"></div>
                <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">
                <div class="input-group"><label data-i18n="doctor_name_label">اسم الطبيب:</label><input type="text" id="docName"></div>
                <div class="input-group"><label data-i18n="specialty_label">التخصص:</label><input type="text" id="docSpecialty"></div>
                <div class="input-group"><label data-i18n="phone_label">رقم الهاتف:</label><input type="tel" id="docPhone"></div>
                <div class="input-group"><label data-i18n="city_label">المدينة:</label><input type="text" id="docCity"></div>
                <div class="input-group"><label data-i18n="street_label">الشارع:</label><input type="text" id="docStreet"></div>
                <div class="input-group"><label data-i18n="start_time_label">وقت الفتح:</label><input type="time" id="docStartTime" value="08:00"></div>
                <div class="input-group"><label data-i18n="end_time_label">وقت الإغلاق:</label><input type="time" id="docEndTime" value="22:00"></div>
                <div id="reg-map"></div>
                <input type="hidden" id="docLat" value=""><input type="hidden" id="docLng" value="">
                <button class="btn-primary" onclick="registerAndSaveDoctor()"><i class="fa-solid fa-save"></i> <span data-i18n="create_account_btn">إنشاء الحساب وحفظ العيادة</span></button>
                <button class="btn-outline" onclick="closeDoctorModal()" style="margin-top:10px; border:none;" data-i18n="cancel_btn">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- مكتبات Firebase والخرائط (خارجية) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

            ar: {
                app_title: "عيادة", doctors_btn: "الأطباء", all_cities: "كل المدن", search_placeholder: "اسم الطبيب أو التخصص...", no_results: "لا يوجد أطباء.", available: "متاح للحجز", closed_temp: "مغلق مؤقتاً", on_break: "استراحة", book_now: "احجز الآن", clinic_location: "موقع العيادة", at_doctor: "عند: ", my_bookings_title: "حجوزاتي", no_bookings: "لا يوجد حجوزات.", your_number: "رقم دورك:", view_ticket: "عرض التذكرة", back_to_search: "العودة للبحث", your_ticket_number: "رقم دورك", status_waiting: "في الانتظار", status_your_turn: "حان دورك!", status_one_left: "بقي مريض واحد", ahead_label: "أمامك", wait_time_label: "دقيقة", eta_label: "الوقت المتوقع", welcome_msg: "أهلاً", ticket_hint: "تتحدث تلقائياً.", back_to_bookings: "العودة", cancel_booking_btn: "إلغاء", confirm_booking_title: "تأكيد الحجز", full_name_label: "الاسم:", name_placeholder: "الاسم", phone_label: "الهاتف:", phone_placeholder: "77...", confirm_btn: "تأكيد", cancel_btn: "إلغاء", doctor_portal_title: "بوابة الأطباء", login_tab: "دخول", register_tab: "جديد", email_label: "الإيميل:", password_label: "المرور:", password_min_label: "كلمة المرور:", activation_code_label: "كود التفعيل:", activation_code_ph: "الكود", remember_me: "تذكرني", login_btn: "دخول", doctor_name_label: "الاسم:", doc_name_ph: "د. أحمد", specialty_label: "التخصص:", specialty_ph: "باطنية", city_label: "المدينة:", city_ph: "صنعاء", street_label: "الشارع:", street_ph: "حدة", start_time_label: "وقت الفتح:", end_time_label: "وقت الإغلاق:", map_location_label: "الموقع:", create_account_btn: "حفظ", active_booking_msg: "لديك {n} حجز", tomorrow: "غداً ", connection_error: "فشل الاتصال", doctors_fetch_error: "خطأ في التحميل"
            },
            en: {

            }

        let currentLang = localStorage.getItem('douri_lang') || 'ar';

            const dict = translations[currentLang];
            if (currentLang === 'ar') {
                document.documentElement.setAttribute('dir', 'rtl');
                if(document.getElementById('langToggleBtn')) document.getElementById('langToggleBtn').innerText = 'EN';
            } else {
                document.documentElement.setAttribute('dir', 'ltr');
                if(document.getElementById('langToggleBtn')) document.getElementById('langToggleBtn').innerText = 'عربي';
            }
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.innerText = dict[key];

                const key = el.getAttribute('data-i18n-placeholder');

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('douri_lang', currentLang);
            window.location.reload();
        }
        function t(key) {
            return translations[currentLang] && translations[currentLang][key] ? translations[currentLang][key] : key;

        function initTheme() {

            if (savedTheme === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); themeBtn.innerHTML = '<i class="fa-solid fa-sun"></i>'; }
            else { document.documentElement.removeAttribute('data-theme'); themeBtn.innerHTML = '<i class="fa-solid fa-moon"></i>'; }
        }
        function toggleTheme() {
            let currentTheme = document.documentElement.getAttribute('data-theme');
            let themeBtn = document.getElementById('themeToggle');
            if (currentTheme === 'dark') { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('douri_theme', 'light'); themeBtn.innerHTML = '<i class="fa-solid fa-moon"></i>'; }
            else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('douri_theme', 'dark'); themeBtn.innerHTML = '<i class="fa-solid fa-sun"></i>'; }
        }
        function getSmartETA(doctorData, peopleAhead) {
            try {
                const now = new Date(); const startStr = doctorData.startTime || "08:00"; const endStr = doctorData.endTime || "22:00"; const serviceTime = doctorData.serviceTime || 10;
                let [startH, startM] = startStr.split(':').map(Number); let [endH, endM] = endStr.split(':').map(Number);
                if (isNaN(startH) || isNaN(startM)) { startH = 8; startM = 0; } if (isNaN(endH) || isNaN(endM)) { endH = 22; endM = 0; }
                let nowM = now.getHours() * 60 + now.getMinutes(); let startM = startH * 60 + startM; let endM = endH * 60 + endM; let eta = new Date(now);
                if (nowM < startM) { eta.setHours(startH, startM, 0, 0); } else if (nowM >= endM) { eta.setDate(eta.getDate() + 1); eta.setHours(startH, startM, 0, 0); }
                eta.setMinutes(eta.getMinutes() + (peopleAhead * serviceTime));
                let etaM = eta.getHours() * 60 + eta.getMinutes(); if (etaM >= endM && peopleAhead > 0) { let overflow = etaM - endM; eta.setDate(eta.getDate() + 1); eta.setHours(startH, startM, 0, 0); eta.setMinutes(eta.getMinutes() + overflow); }
                let timeStr = String(eta.getHours()).padStart(2, '0') + ":" + String(eta.getMinutes()).padStart(2, '0');
                if (eta.getDate() !== now.getDate()) { return t('tomorrow') + timeStr; } return timeStr;
            } catch (e) { return "---"; }
        }
        function loadPatients() {
            db.collection("patients").onSnapshot((snapshot) => {
                patientDirectory = {}; let datalist = document.getElementById('patientNames'); if(!datalist) return; datalist.innerHTML = '';
                snapshot.forEach((doc) => { let data = doc.data(); patientDirectory[data.name] = data.phone; datalist.innerHTML += `<option value="${data.name}">`; });
            });
        }
        function loadDoctors() {
            const list = document.getElementById('doctorsList');
            let timeout = setTimeout(() => { if (list.innerHTML.includes('skeleton-card')) { list.innerHTML = `<p style="text-align:center; color:red; padding:20px; background:#fee2e2; border-radius:10px;"><b>${t('connection_error')}</b></p>`; } }, 5000);
            db.collection("doctors").onSnapshot((snapshot) => {
                clearTimeout(timeout); allDoctors = []; let cities = new Set();
                snapshot.forEach((doc) => { let data = doc.data(); allDoctors.push({ id: doc.id, ...data }); if (data.address && data.address.city) { cities.add(data.address.city); } });
                let citySelect = document.getElementById('cityFilter');
                if (citySelect) { let currentSelection = citySelect.value; citySelect.innerHTML = `<option value="">${t('all_cities')}</option>`; cities.forEach(city => { citySelect.innerHTML += `<option value="${city}">${city}</option>`; }); if (currentSelection) citySelect.value = currentSelection; }
                filterDoctors(); updateBanner();
            }, (error) => { clearTimeout(timeout); list.innerHTML = `<p style="text-align:center; color:red; padding:20px; background:#fee2e2; border-radius:10px;"><b>${t('doctors_fetch_error')}</b></p>`; });
        }
        function renderDoctors(doctorsToRender) {
            const list = document.getElementById('doctorsList'); if (!list) return; list.innerHTML = '';
            if (doctorsToRender.length === 0) { list.innerHTML = `<p style="text-align:center; color:var(--text-muted); margin-top:20px;">${t('no_results')}</p>`; return; }
            doctorsToRender.forEach(doc => {
                let addressText = doc.address ? `${doc.address.city || ''} - ${doc.address.street || ''}` : '';
                let mapLink = doc.location && doc.location.lat ? `https://www.google.com/maps/search/?api=1&query=${doc.location.lat},${doc.location.lng}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addressText)}`;
                let isClosed = doc.isOpen === false;
                let badgeHTML = isClosed ? `<span class="badge red" style="background:var(--danger-light); color:var(--danger);">${t('closed_temp')}</span>` : `<span class="badge green">${t('available')}</span>`;
                let btnHTML = isClosed ? `<button class="book-btn" style="background-color:var(--text-muted);" disabled>${t('on_break')}</button>` : `<button class="book-btn" onclick="openBookingModal('${doc.id}', '${doc.name}')">${t('book_now')}</button>`;
                list.innerHTML += `<div class="clinic-card" style="${isClosed ? 'opacity: 0.7;' : ''}"><div class="clinic-info"><h2>${doc.name}</h2><p class="doc-specialty">${doc.specialty}</p><p class="doc-address">📍 ${addressText}</p><a href="${mapLink}" target="_blank" class="map-btn">${t('clinic_location')}</a></div><div class="clinic-status" style="margin-top: 15px;">${badgeHTML}</div>${btnHTML}</div>`;
            });
        }
        function filterDoctors() {
            let selectedCity = document.getElementById('cityFilter').value; let textQuery = document.getElementById('searchInput').value.toLowerCase();
            let filtered = allDoctors.filter(doc => { let matchesCity = selectedCity === "" || (doc.address && doc.address.city === selectedCity); let matchesText = (doc.name || '').toLowerCase().includes(textQuery) || (doc.specialty || '').toLowerCase().includes(textQuery); return matchesCity && matchesText; });
            renderDoctors(filtered);
        }
        function openBookingModal(doctorId, doctorName) {
            modalDoctorId = doctorId; modalDoctorName = doctorName; document.getElementById('modalDoctorName').innerText = t('at_doctor') + doctorName;
            document.getElementById('bookingName').value = ''; document.getElementById('bookingPhone').value = ''; document.getElementById('bookingModal').classList.remove('hidden');
        }
        function autofillPhone() { let currentInput = document.getElementById('bookingName').value.trim(); if (patientDirectory[currentInput]) { document.getElementById('bookingPhone').value = patientDirectory[currentInput]; } }
        function closeModal() { document.getElementById('bookingModal').classList.add('hidden'); modalDoctorId = null; modalDoctorName = null; }
        async function confirmBooking() {
            let name = document.getElementById('bookingName').value.trim(); let phone = document.getElementById('bookingPhone').value.trim();
            if (!name || !phone) return alert(currentLang === 'ar' ? "يرجى إدخال البيانات!" : "Please enter data!");
            try {
                const docRef = db.collection("doctors").doc(modalDoctorId); const docSnap = await docRef.get();
                if (docSnap.exists) {
                    if (docSnap.data().isOpen === false) return alert(t('closed_temp'));
                    let currentTicket = (docSnap.data().lastTicket || 0) + 1; await docRef.update({ lastTicket: currentTicket });
                    await db.collection("patients").doc(phone).set({ name: name, phone: phone, lastVisit: firebase.firestore.FieldValue.serverTimestamp() });
                    const bookingRef = await db.collection("bookings").add({ doctorId: modalDoctorId, doctorName: modalDoctorName, patientName: name, patientPhone: phone, ticketNumber: currentTicket, status: 'waiting', createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                    let myBookings = JSON.parse(localStorage.getItem('douri_bookings') || '[]');
                    myBookings.push({ firebaseId: bookingRef.id, ticket: currentTicket, doctorId: modalDoctorId, doctorName: modalDoctorName, name: name, phone: phone, date: new Date().toISOString() });
                    localStorage.setItem('douri_bookings', JSON.stringify(myBookings));
                    closeModal(); alert((currentLang === 'ar' ? "تم الحجز! رقم دورك: " : "Booked! Your number: ") + currentTicket); updateBanner(); listenToMyBookings(); showMyBookingsView();
                }
            } catch (error) { alert("Error: " + error.message); }
        }
        function updateBanner() {
            let myBookings = JSON.parse(localStorage.getItem('douri_bookings') || '[]'); let banner = document.getElementById('activeBookingBanner'); let bannerText = document.getElementById('bannerText');
            if (banner && bannerText) { if (myBookings.length > 0) { banner.classList.remove('hidden'); bannerText.innerText = t('active_booking_msg').replace('{n}', myBookings.length); } else { banner.classList.add('hidden'); } }
        }
        function showMyBookingsView() {
            document.getElementById('main-view').classList.add('hidden'); document.getElementById('ticket-view').classList.add('hidden'); document.getElementById('bookings-view').classList.remove('hidden');
            let myBookings = JSON.parse(localStorage.getItem('douri_bookings') || '[]'); let list = document.getElementById('myBookingsList'); list.innerHTML = '';
            if (myBookings.length === 0) return list.innerHTML = `<p style="text-align:center; color:var(--text-muted);">${t('no_bookings')}</p>`;
            myBookings.forEach((b, index) => { list.innerHTML += `<div class="clinic-card" style="border-right: 5px solid var(--primary);"><h3 style="margin:0; font-size:16px; color:var(--text-main);">${b.doctorName}</h3><p class="muted" style="margin:5px 0;">${t('your_number')} <b>${b.ticket}</b></p><button class="book-btn" style="padding:8px; font-size:14px;" onclick="openSpecificTicket(${index})">${t('view_ticket')}</button></div>`; });
        }
        function listenToMyBookings() {
            myBookingsListeners.forEach(u => u()); myBookingsListeners = []; let myBookings = JSON.parse(localStorage.getItem('douri_bookings') || '[]');
            myBookings.forEach((b) => {
                if (b.firebaseId) {
                    const unsubscribe = db.collection("bookings").doc(b.firebaseId).onSnapshot((doc) => {
                        if (doc.exists) {
                            const status = doc.data().status;
                            if (status === 'serving' || status === 'done' || status === 'cancelled') {
                                let currentBookings = JSON.parse(localStorage.getItem('douri_bookings') || '[]'); let updated = currentBookings.filter(x => x.firebaseId !== b.firebaseId);
                                localStorage.setItem('douri_bookings', JSON.stringify(updated)); updateBanner();
                                if (!document.getElementById('bookings-view').classList.contains('hidden')) { showMyBookingsView(); }
                                if (activeTicketToDisplay && activeTicketToDisplay.firebaseId === b.firebaseId && status === 'serving') { alert(currentLang === 'ar' ? "حان دورك الآن!" : "It's your turn!"); goBackToSearch(); }
                            }
                        }
                    }); myBookingsListeners.push(unsubscribe);
                }
            });
        }
        function openSpecificTicket(index) {
            let b = JSON.parse(localStorage.getItem('douri_bookings') || '[]')[index]; activeTicketToDisplay = b;
            document.getElementById('bookings-view').classList.add('hidden'); document.getElementById('ticket-view').classList.remove('hidden');
            document.getElementById('patientNameDisplay').innerText = b.name; document.getElementById('ticketNumber').innerText = b.ticket; document.getElementById('doctorNameDisplay').innerText = t('at_doctor') + b.doctorName;
            if ("Notification" in window) { if (Notification.permission !== "granted" && Notification.permission !== "denied") { Notification.requestPermission(); } }
            if (currentListener) currentListener(); const docRef = db.collection("doctors").doc(b.doctorId); let currentNotificationState = "";
            currentListener = docRef.onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data(); const currentServing = data.currentServing || 1;
                    let peopleAhead = b.ticket - currentServing - 1; if (peopleAhead < 0) peopleAhead = 0;
                    document.getElementById('peopleAhead').innerText = peopleAhead;
                    const smartTime = getSmartETA(data, peopleAhead); document.getElementById('etaTime').innerText = smartTime;
                    if(smartTime.includes(t('tomorrow'))) { document.getElementById('waitTime').innerText = "-"; } else { const serviceTime = data.serviceTime || 10; document.getElementById('waitTime').innerText = "~" + (peopleAhead * serviceTime); }
                    let badge = document.querySelector('.status-badge');
                    if (peopleAhead === 0 && b.ticket == currentServing) {
                        badge.innerText = t('status_your_turn'); badge.style.backgroundColor = "var(--success-light)"; badge.style.color = "var(--success)";
                        if (currentNotificationState !== 'turn' && Notification.permission === "granted") { new Notification(t('status_your_turn'), { body: t('at_doctor') + b.doctorName }); currentNotificationState = 'turn'; }
                    } else if (peopleAhead === 1) {
                        badge.innerText = t('status_one_left'); badge.style.backgroundColor = "var(--warning-light)"; badge.style.color = "var(--warning)";
                        if (currentNotificationState !== 'near' && Notification.permission === "granted") { new Notification(t('status_one_left'), { body: t('at_doctor') + b.doctorName }); currentNotificationState = 'near'; }
                    } else { badge.innerText = t('status_waiting'); badge.style.backgroundColor = "var(--warning-light)"; badge.style.color = "var(--warning)"; }
                }
            });
        }
        function cancelCurrentTicket() {
            if(!activeTicketToDisplay) return; if(!confirm(currentLang === 'ar' ? "إلغاء الحجز؟" : "Cancel booking?")) return;
            if(activeTicketToDisplay.firebaseId) { db.collection("bookings").doc(activeTicketToDisplay.firebaseId).update({ status: 'cancelled' }); }
            let myBookings = JSON.parse(localStorage.getItem('douri_bookings') || '[]'); let updatedBookings = myBookings.filter(b => !(b.doctorId === activeTicketToDisplay.doctorId && b.ticket === activeTicketToDisplay.ticket));
            localStorage.setItem('douri_bookings', JSON.stringify(updatedBookings)); if (currentListener) currentListener(); activeTicketToDisplay = null; updateBanner(); listenToMyBookings(); showMyBookingsView();
        }
        function goBackToSearch() { document.getElementById('ticket-view').classList.add('hidden'); document.getElementById('bookings-view').classList.add('hidden'); document.getElementById('main-view').classList.remove('hidden'); if (currentListener) currentListener(); }
        function openDoctorModal() { document.getElementById('doctorModal').classList.remove('hidden'); setTimeout(() => { if (!doctorMap) initDoctorMap(); else doctorMap.invalidateSize(); }, 300); }
        function closeDoctorModal() { document.getElementById('doctorModal').classList.add('hidden'); }
        function switchAuthTab(tab) {
            if (tab === 'login') { document.getElementById('tabLogin').classList.add('active'); document.getElementById('tabRegister').classList.remove('active'); document.getElementById('loginSection').classList.remove('hidden'); document.getElementById('registerSection').classList.add('hidden'); }
            else { document.getElementById('tabRegister').classList.add('active'); document.getElementById('tabLogin').classList.remove('active'); document.getElementById('registerSection').classList.remove('hidden'); document.getElementById('loginSection').classList.add('hidden'); setTimeout(() => { if (doctorMap) doctorMap.invalidateSize(); }, 200); }
        }
        function initDoctorMap() {
            let defaultLat = 15.3694; let defaultLng = 44.1910; doctorMap = L.map('reg-map').setView([defaultLat, defaultLng], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(doctorMap);
            doctorMap.on('click', function(e) { document.getElementById('docLat').value = e.latlng.lat; document.getElementById('docLng').value = e.latlng.lng; if (doctorMarker) doctorMarker.setLatLng(e.latlng); else doctorMarker = L.marker(e.latlng).addTo(doctorMap); });
        }
        function loginDoctor() {
            let email = document.getElementById('loginEmail').value.trim(); let password = document.getElementById('loginPassword').value; let remember = document.getElementById('rememberMe').checked; let btn = document.querySelector('#loginSection .btn-primary');
            if (!email || !password) return alert("أدخل البيانات"); let originalText = btn.innerHTML; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; btn.disabled = true;
            auth.signInWithEmailAndPassword(email, password).then((u) => { if (remember) localStorage.setItem('douri_saved_email', email); else localStorage.removeItem('douri_saved_email'); window.location.href = 'admin.html'; })
                .catch((e) => { btn.innerHTML = originalText; btn.disabled = false; alert("خطأ: " + e.message); });
        }
        async function registerAndSaveDoctor() {
            let email = document.getElementById('regEmail').value.trim(); let password = document.getElementById('regPassword').value; let activationCode = document.getElementById('regActivationCode').value.trim(); let name = document.getElementById('docName').value.trim(); let specialty = document.getElementById('docSpecialty').value.trim(); let phone = document.getElementById('docPhone').value.trim(); let city = document.getElementById('docCity').value.trim(); let street = document.getElementById('docStreet').value.trim(); let startTime = document.getElementById('docStartTime').value; let endTime = document.getElementById('docEndTime').value; let lat = document.getElementById('docLat').value; let lng = document.getElementById('docLng').value;
            if (!email || !password || !name || !specialty || !city || !activationCode) { return alert("أكمل البيانات!"); }
            if (activationCode !== adminSecretCode) { return alert("الكود خاطئ!"); }
            if (password.length < 6) return alert("كلمة المرور قصيرة"); if (!lat || !lng) return alert("حدد الموقع!");
            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password); const user = userCredential.user;
                await db.collection("doctors").add({ ownerUid: user.uid, email: user.email, name: name, specialty: specialty, phone: phone, address: { city: city, street: street }, location: { lat: Number(lat), lng: Number(lng) }, serviceTime: 10, startTime: startTime, endTime: endTime, currentServing: 1, lastTicket: 0, isOpen: true, createdAt: new Date().toISOString() });
                alert("تم الحفظ!"); window.location.href = 'admin.html';
            } catch (error) { alert("خطأ: " + error.message); }
        }
        window.onload = function() {
            applyLanguage(); initTheme(); loadDoctors(); loadPatients(); updateBanner();
            let oldBookings = JSON.parse(localStorage.getItem('douri_bookings') || '[]'); let cleanBookings = oldBookings.filter(b => b.firebaseId); localStorage.setItem('douri_bookings', JSON.stringify(cleanBookings));
            listenToMyBookings();
            let savedEmail = localStorage.getItem('douri_saved_email');
            if (savedEmail) { let emailInput = document.getElementById('loginEmail'); let rememberCheckbox = document.getElementById('rememberMe'); if (emailInput && rememberCheckbox) { emailInput.value = savedEmail; rememberCheckbox.checked = true; } }
        }
    </script>
</body>
