<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="app_title">عيادة | Clinic</title>
    <!-- استخدام سيرفر Cloudflare للمكتبات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        :root {
            --primary: #0f766e; --primary-light: #ccfbf1; --bg-color: #f0f8f7;
            --card-bg: #ffffff; --text-main: #333333; --text-muted: #6b7280;
            --border-color: #e5e7eb; --danger: #dc2626; --danger-light: #fee2e2;
            --warning: #d97706; --warning-light: #fef3c7; --success: #059669; --success-light: #d1fae5;
        }
        [data-theme="dark"] {
            --primary: #14b8a6; --primary-light: #134e4a; --bg-color: #111827;
            --card-bg: #1f2937; --text-main: #f3f4f6; --text-muted: #9ca3af;
            --border-color: #374151; --danger: #ef4444; --danger-light: #7f1d1d;
            --warning: #fbbf24; --warning-light: #78350f; --success: #10b981; --success-light: #064e3b;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; padding-bottom: 30px; }
        .top-header { background-color: var(--primary); color: white; padding: 20px; border-radius: 0 0 20px 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header-content { display: flex; justify-content: space-between; align-items: center; max-width: 800px; margin: 0 auto; }
        .top-header h1 { margin: 0; font-size: 24px; }
        .header-buttons { display: flex; gap: 8px; align-items: center; }
        .btn-doctor-login, .lang-btn, .theme-btn { background: rgba(255,255,255,0.2); color: white; border: 1px solid white; padding: 8px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .theme-btn { padding: 8px; border-radius: 50%; width: 40px; height: 40px; justify-content: center; }
        .btn-doctor-login:hover, .lang-btn:hover, .theme-btn:hover { background: white; color: var(--primary); }
        .container { max-width: 800px; margin: 0 auto; padding: 0 15px; }
        .filter-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .input-icon-wrapper { position: relative; flex: 1; min-width: 150px; }
        .input-icon-wrapper i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .input-icon-wrapper input, .input-icon-wrapper select { width: 100%; padding: 12px 40px 12px 15px; border: 1px solid var(--border-color); border-radius: 12px; background-color: var(--card-bg); color: var(--text-main); font-size: 15px; outline: none; }
        .clinic-card { background-color: var(--card-bg); border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: right; border: 1px solid var(--border-color); animation: slideUp 0.4s ease-out; }
        .clinic-info h2 { color: var(--text-main); font-size: 18px; margin: 0 0 5px 0; }
        .doc-specialty { color: var(--primary); font-weight: bold; font-size: 14px; margin-bottom: 10px; }
        .doc-address { color: var(--text-muted); font-size: 13px; margin-bottom: 10px; }
        .map-btn { display: inline-flex; align-items: center; gap: 6px; background-color: var(--bg-color); color: var(--primary); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: bold; text-decoration: none; margin-top: 5px; }
        .clinic-status { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge.green { background-color: var(--success-light); color: var(--success); }
        button { font-family: inherit; font-weight: bold; cursor: pointer; border-radius: 10px; transition: transform 0.1s; display: flex; justify-content: center; align-items: center; gap: 8px; border: none;}
        button:active { transform: scale(0.97); }
        .btn-primary, .book-btn { width: 100%; padding: 12px; background-color: var(--primary); color: white; font-size: 16px; }
        .btn-outline { width: 100%; padding: 12px; background-color: transparent; color: var(--primary); border: 1px solid var(--primary); font-size: 14px; margin-bottom: 10px; }
        .btn-danger { width: 100%; padding: 12px; background-color: transparent; color: var(--danger); border: 1px solid var(--danger); font-size: 14px; }
        #activeBookingBanner { background-color: var(--success-light); color: var(--success); padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: center; font-weight: bold; cursor: pointer; border: 1px solid var(--success); }
        .hidden { display: none !important; }
        .ticket-card { background-color: var(--card-bg); border-radius: 20px; padding: 30px 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid var(--border-color); animation: slideUp 0.5s ease-out; }
        .muted { color: var(--text-muted); font-size: 14px; margin-bottom: 5px; }
        .big-number { font-size: 80px; font-weight: 900; color: var(--primary); margin: 0; line-height: 1; }
        .status-badge { display: inline-block; background-color: var(--warning-light); color: var(--warning); padding: 6px 18px; border-radius: 20px; font-size: 14px; font-weight: bold; margin-top: 15px; margin-bottom: 25px; }
        .stats-row { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 25px; }
        .stat-box { flex: 1; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px 5px; }
        .stat-value { font-size: 22px; font-weight: bold; color: var(--text-main); }
        .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 5px; }
        .ticket-hint { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.6; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(3px); }
        .modal-content { background-color: var(--card-bg); width: 90%; max-width: 400px; padding: 25px; border-radius: 20px; border: 1px solid var(--border-color); animation: popIn 0.3s; }
        .input-group { margin-bottom: 15px; text-align: right; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--text-main); font-size: 14px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 16px; background-color: var(--bg-color); color: var(--text-main);}
        .view-title { text-align: center; color: var(--primary); margin-top: 0; }
        .skeleton-card { height: 150px; background-color: var(--border-color); border-radius: 16px; margin-bottom: 15px; animation: shimmer 1.5s infinite linear; background-image: linear-gradient(90deg, var(--border-color) 0px, var(--card-bg) 40px, var(--border-color) 80px); background-size: 600px; }
        .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); }
        .auth-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-weight: bold; color: var(--text-muted); border-bottom: 3px solid transparent; }
        .auth-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        #reg-map { height: 200px; width: 100%; border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--border-color); z-index: 1; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes shimmer { 0% { background-position: -600px 0; } 100% { background-position: 600px 0; } }
    </style>
</head>
<body>

    <header class="top-header">
        <div class="header-content">
            <div><h1 data-i18n="app_title">عيادة | Clinic</h1></div>
            <div class="header-buttons">
                <button class="lang-btn" onclick="toggleLanguage()" id="langToggleBtn">EN</button>
                <button class="btn-doctor-login" onclick="openDoctorModal()"><i class="fa-solid fa-user-doctor"></i> <span data-i18n="doctors_btn">الأطباء</span></button>
                <button id="themeToggle" class="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
            </div>
        </div>
    </header>

    <div class="container">
        <div id="main-view">
            <div id="activeBookingBanner" class="hidden" onclick="showMyBookingsView()"><i class="fa-solid fa-ticket"></i> <span id="bannerText"></span></div>
            <div class="filter-row">
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-city"></i>
                    <select id="cityFilter" onchange="filterDoctors()"><option value="" data-i18n="all_cities">كل المدن</option></select>
                </div>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="اسم الطبيب أو التخصص..." oninput="filterDoctors()" data-i18n-placeholder="search_placeholder">
                </div>
            </div>
            <div id="doctorsList">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
        </div>

        <div id="bookings-view" class="hidden">
            <h3 class="view-title" data-i18n="my_bookings_title">حجوزاتي النشطة</h3>
            <div id="myBookingsList"></div>
            <button class="btn-primary" onclick="goBackToSearch()"><i class="fa-solid fa-arrow-right"></i> <span data-i18n="back_to_search">العودة للبحث</span></button>
        </div>

        <div id="ticket-view" class="hidden">
            <div class="ticket-card">
                <p class="muted" data-i18n="your_ticket_number">رقم دورك</p>
                <div class="big-number" id="ticketNumber">1</div>
                <div class="status-badge" data-i18n="status_waiting">في الانتظار</div>
                <div class="stats-row">
                    <div class="stat-box"><div class="stat-value" id="peopleAhead">—</div><div class="stat-label" data-i18n="ahead_label">أمامك</div></div>
                    <div class="stat-box"><div class="stat-value" id="waitTime">—</div><div class="stat-label" data-i18n="wait_time_label">دقيقة انتظار</div></div>
                    <div class="stat-box"><div class="stat-value" id="etaTime">—</div><div class="stat-label" data-i18n="eta_label">الوقت المتوقع</div></div>
                </div>
                <p class="ticket-hint"><span data-i18n="welcome_msg">أهلاً</span> <span id="patientNameDisplay" style="font-weight:bold;"></span>، <span data-i18n="ticket_hint">شاشة التذكرة تتحدث تلقائياً.</span></p>
                <p class="muted" id="doctorNameDisplay" style="font-size:14px; font-weight:bold; color:var(--primary);"></p>
                <button class="btn-outline" onclick="showMyBookingsView()"><i class="fa-solid fa-list"></i> <span data-i18n="back_to_bookings">العودة لقائمة حجوزاتي</span></button>
                <button class="btn-danger" onclick="cancelCurrentTicket()"><i class="fa-solid fa-trash"></i> <span data-i18n="cancel_booking_btn">إلغاء هذا الحجز</span></button>
            </div>
        </div>
    </div>

    <div id="bookingModal" class="hidden modal-overlay">
        <div class="modal-content">
            <h3 class="view-title" data-i18n="confirm_booking_title">تأكيد الحجز</h3>
            <p class="muted" id="modalDoctorName" style="text-align: center; margin-bottom: 20px;">عند: ...</p>
            <div class="input-group">
                <label data-i18n="full_name_label">الاسم الكامل:</label>
                <input type="text" id="bookingName" list="patientNames" oninput="autofillPhone()" placeholder="اكتب اسمك هنا" data-i18n-placeholder="name_placeholder">
                <datalist id="patientNames"></datalist>
            </div>
            <div class="input-group">
                <label data-i18n="phone_label">رقم الهاتف:</label>
                <input type="tel" inputmode="numeric" id="bookingPhone" placeholder="مثال: 777123456" data-i18n-placeholder="phone_placeholder">
            </div>
            <button class="btn-primary" onclick="confirmBooking()"><i class="fa-solid fa-check"></i> <span data-i18n="confirm_btn">تأكيد الحجز</span></button>
            <button class="btn-outline" onclick="closeModal()" style="margin-top:10px; border:none;" data-i18n="cancel_btn">إلغاء</button>
        </div>
    </div>

    <div id="doctorModal" class="hidden modal-overlay">
        <div class="modal-content" style="max-height: 90vh; overflow-y: auto;">
            <h3 class="view-title" style="margin-bottom: 10px;" data-i18n="doctor_portal_title">بوابة الأطباء</h3>
            <div class="auth-tabs">
                <div id="tabLogin" class="auth-tab active" onclick="switchAuthTab('login')" data-i18n="login_tab">دخول</div>
                <div id="tabRegister" class="auth-tab" onclick="switchAuthTab('register')" data-i18n="register_tab">حساب طبيب جديد</div>
            </div>
            <div id="loginSection">
                <div class="input-group"><label data-i18n="email_label">البريد الإلكتروني:</label><input type="email" id="loginEmail" autocomplete="username"></div>
                <div class="input-group"><label data-i18n="password_label">كلمة المرور:</label><input type="password" id="loginPassword" autocomplete="current-password"></div>
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 15px;">
                    <input type="checkbox" id="rememberMe" style="width: 18px; height: 18px;">
                    <label for="rememberMe" data-i18n="remember_me">تذكرني</label>
                </div>
                <button class="btn-primary" onclick="loginDoctor()"><i class="fa-solid fa-right-to-bracket"></i> <span data-i18n="login_btn">تسجيل الدخول</span></button>
                <button class="btn-outline" onclick="closeDoctorModal()" style="margin-top:10px; border:none;" data-i18n="cancel_btn">إلغاء</button>
            </div>
            <div id="registerSection" class="hidden">
                <div class="input-group"><label data-i18n="email_label">البريد الإلكتروني:</label><input type="email" id="regEmail"></div>
                <div class="input-group"><label data-i18n="password_min_label">كلمة المرور (6 أحرف على الأقل):</label><input type="password" id="regPassword"></div>
                <div class="input-group"><label data-i18n="activation_code_label">كود التفعيل:</label><input type="text" id="regActivationCode"></div>
                <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">
                <div class="input-group"><label data-i18n="doctor_name_label">اسم الطبيب:</label><input type="text" id="docName"></div>
                <div class="input-group"><label data-i18n="specialty_label">التخصص:</label><input type="text" id="docSpecialty"></div>
                <div class="input-group"><label data-i18n="phone_label">رقم الهاتف:</label><input type="tel" id="docPhone"></div>
                <div class="input-group"><label data-i18n="city_label">المدينة:</label><input type="text" id="docCity"></div>
                <div class="input-group"><label data-i18n="street_label">الشارع:</label><input type="text" id="docStreet"></div>
                <div class="input-group"><label data-i18n="start_time_label">وقت الفتح:</label><input type="time" id="docStartTime" value="08:00"></div>
                <div class="input-group"><label data-i18n="end_time_label">وقت الإغلاق:</label><input type="time" id="docEndTime" value="22:00"></div>
                <div id="reg-map"></div>
                <input type="hidden" id="docLat" value=""><input type="hidden" id="docLng" value="">
                <button class="btn-primary" onclick="registerAndSaveDoctor()"><i class="fa-solid fa-save"></i> <span data-i18n="create_account_btn">إنشاء الحساب وحفظ العيادة</span></button>
                <button class="btn-outline" onclick="closeDoctorModal()" style="margin-top:10px; border:none;" data-i18n="cancel_btn">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- الترجمة -->
    <script>
        const translations = {
            ar: { app_title: "عيادة", doctors_btn: "الأطباء", all_cities: "كل المدن", search_placeholder: "اسم الطبيب أو التخصص...", no_results: "لا يوجد أطباء.", available: "متاح للحجز", closed_temp: "مغلق مؤقتاً", on_break: "استراحة", book_now: "احجز الآن", clinic_location: "موقع العيادة", at_doctor: "عند: ", my_bookings_title: "حجوزاتي", no_bookings: "لا يوجد حجوزات.", your_number: "رقم دورك:", view_ticket: "عرض التذكرة", back_to_search: "العودة للبحث", your_ticket_number: "رقم دورك", status_waiting: "في الانتظار", status_your_turn: "حان دورك!", status_one_left: "بقي مريض واحد", ahead_label: "أمامك", wait_time_label: "دقيقة", eta_label: "الوقت المتوقع", welcome_msg: "أهلاً", ticket_hint: "تتحدث تلقائياً.", back_to_bookings: "العودة", cancel_booking_btn: "إلغاء", confirm_booking_title: "تأكيد الحجز", full_name_label: "الاسم:", name_placeholder: "الاسم", phone_label: "الهاتف:", phone_placeholder: "77...", confirm_btn: "تأكيد", cancel_btn: "إلغاء", doctor_portal_title: "بوابة الأطباء", login_tab: "دخول", register_tab: "جديد", email_label: "الإيميل:", password_label: "المرور:", password_min_label: "كلمة المرور:", activation_code_label: "كود التفعيل:", activation_code_ph: "الكود", remember_me: "تذكرني", login_btn: "دخول", doctor_name_label: "الاسم:", doc_name_ph: "د. أحمد", specialty_label: "التخصص:", specialty_ph: "باطنية", city_label: "المدينة:", city_ph: "صنعاء", street_label: "الشارع:", street_ph: "حدة", start_time_label: "وقت الفتح:", end_time_label: "وقت الإغلاق:", map_location_label: "الموقع:", create_account_btn: "حفظ", active_booking_msg: "لديك {n} حجز", tomorrow: "غداً ", connection_error: "فشل الاتصال", doctors_fetch_error: "خطأ في التحميل" },
            en: { app_title: "Clinic", doctors_btn: "Doctors", all_cities: "All Cities", search_placeholder: "Doctor...", no_results: "No doctors.", available: "Available", closed_temp: "Closed", on_break: "Break", book_now: "Book Now", clinic_location: "Location", at_doctor: "At: ", my_bookings_title: "Bookings", no_bookings: "No bookings.", your_number: "Number:", view_ticket: "View", back_to_search: "Back", your_ticket_number: "Your Number", status_waiting: "Waiting", status_your_turn: "Your Turn!", status_one_left: "One left", ahead_label: "Ahead", wait_time_label: "Min", eta_label: "ETA", welcome_msg: "Welcome", ticket_hint: "Updates automatically.", back_to_bookings: "Back", cancel_booking_btn: "Cancel", confirm_booking_title: "Confirm", full_name_label: "Name:", name_placeholder: "Name", phone_label: "Phone:", phone_placeholder: "77...", confirm_btn: "Confirm", cancel_btn: "Cancel", doctor_portal_title: "Doctor Portal", login_tab: "Login", register_tab: "New", email_label: "Email:", password_label: "Pass:", password_min_label: "Pass (6):", activation_code_label: "Code:", activation_code_ph: "Code", remember_me: "Remember me", login_btn: "Login", doctor_name_label: "Name:", doc_name_ph: "Dr. A", specialty_label: "Specialty:", specialty_ph: "Internal", city_label: "City:", city_ph: "Sanaa", street_label: "Street:", street_ph: "Hadda", start_time_label: "Open:", end_time_label: "Close:", map_location_label: "Location:", create_account_btn: "Save", active_booking_msg: "You have {n} booking(s)", tomorrow: "Tmrw ", connection_error: "Connection failed", doctors_fetch_error: "Fetch error" }
        };
        let currentLang = localStorage.getItem('douri_lang') || 'ar';
        function applyLanguage() {
            const dict = translations[currentLang];
            if (currentLang === 'ar') { document.documentElement.setAttribute('dir', 'rtl'); if(document.getElementById('langToggleBtn')) document.getElementById('langToggleBtn').innerText = 'EN'; }
            else { document.documentElement.setAttribute('dir', 'ltr'); if(document.getElementById('langToggleBtn')) document.getElementById('langToggleBtn').innerText = 'عربي'; }
            document.querySelectorAll('[data-i18n]').forEach(el => { const key = el.getAttribute('data-i18n'); if (dict[key]) el.innerText = dict[key]; });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { const key = el.getAttribute('data-i18n-placeholder'); if (dict[key]) el.setAttribute('placeholder', dict[key]); });
            document.title = dict.app_title;
            let citySelect = document.getElementById('cityFilter');
            if (citySelect && citySelect.options.length > 0) citySelect.options[0].text = dict.all_cities;
        }
        function toggleLanguage() { currentLang = currentLang === 'ar' ? 'en' : 'ar'; localStorage.setItem('douri_lang', currentLang); window.location.reload(); }
        function t(key) { return translations[currentLang] && translations[currentLang][key] ? translations[currentLang][key] : key; }
    </script>

    </script>
    
    <!-- سكربتات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</body>
</html>
